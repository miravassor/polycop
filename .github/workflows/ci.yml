# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the runner's Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27' || { echo "::error::Xcode 27 is required"; exit 1; }

      - name: Install GnuPG
        run: command -v gpg >/dev/null || brew install gnupg

      # Both dependencies take minutes to build, so each is cached on the
      # script that builds it.
      - name: Restore ffmpeg
        id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('Tools/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: Tools/build-ffmpeg.sh

      - name: Restore audio.cpp
        id: audiocpp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/AudioCppFramework/audiocpp.xcframework
          key: audiocpp-${{ runner.os }}-${{ hashFiles('Tools/build-audiocpp.sh') }}

      - name: Build audio.cpp
        if: steps.audiocpp.outputs.cache-hit != 'true'
        run: Tools/build-audiocpp.sh

      - name: Check the notices shipped in the app
        run: cmp THIRD_PARTY_NOTICES.md App/Polycop/Resources/Licenses/ThirdPartyNotices.txt

      - name: Lint
        run: xcrun swift-format lint --strict --recursive App Packages

      - name: Test
        run: >
          xcodebuild test
          -project App/Polycop.xcodeproj
          -scheme Polycop
          -destination 'platform=macOS,arch=arm64'
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

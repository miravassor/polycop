name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # to check out the code

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: Tools/lint-workflows.sh

  test:
    name: ${{ matrix.check }}
    runs-on: xcode-27
    timeout-minutes: 90
    # The sanitizers find data races and memory errors the tests pass through:
    # the engines share C state across queues, and the decoder reads raw bytes.
    # They cannot run in the same process, so each has its own run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: tests
            options: -enableCodeCoverage YES -resultBundlePath build/Tests.xcresult
          - check: thread sanitizer
            options: -enableThreadSanitizer YES
          - check: address sanitizer
            options: -enableAddressSanitizer YES
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the runner's Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27' || { echo "::error::Xcode 27 is required"; exit 1; }

      - name: Install GnuPG
        run: command -v gpg >/dev/null || brew install gnupg

      # Both dependencies take minutes to build, so each is cached on the
      # script that builds it.
      - name: Restore ffmpeg
        id: ffmpeg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('Tools/build-ffmpeg.sh') }}

      - name: Build ffmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: Tools/build-ffmpeg.sh

      - name: Restore audio.cpp
        id: audiocpp
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/AudioCppFramework/audiocpp.xcframework
          key: audiocpp-${{ runner.os }}-${{ hashFiles('Tools/build-audiocpp.sh') }}

      - name: Build audio.cpp
        if: steps.audiocpp.outputs.cache-hit != 'true'
        run: Tools/build-audiocpp.sh

      - name: Check the notices shipped in the app
        if: matrix.check == 'tests'
        run: cmp THIRD_PARTY_NOTICES.md App/Polycop/Resources/Licenses/ThirdPartyNotices.txt

      - name: Check the pinned versions agree
        if: matrix.check == 'tests'
        run: Tools/check-versions.sh

      - name: Lint
        if: matrix.check == 'tests'
        run: Tools/lint.sh

      # Through the environment rather than expanded into the script, then
      # split into words.
      - name: Test
        env:
          OPTIONS: ${{ matrix.options }}
        run: |
          read -ra options <<< "$OPTIONS"
          xcodebuild test \
            -project App/Polycop.xcodeproj \
            -scheme Polycop \
            -destination 'platform=macOS,arch=arm64' \
            "${options[@]}" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Coverage
        if: matrix.check == 'tests'
        run: |
          {
            echo '```'
            xcrun xccov view --report --only-targets build/Tests.xcresult
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

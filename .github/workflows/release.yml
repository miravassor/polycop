# SPDX-License-Identifier: GPL-3.0-or-later
# Builds a release from a version tag such as v0.2.0 and drafts it on GitHub.
# Dependencies are built from their pinned sources, without cache.
#
# The build runs third-party build systems and tests, so it gets read access
# only. A second job, which runs nothing from the repository, attests what was
# built and drafts the release. Run by hand, the workflow builds and stops
# there, as a rehearsal.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read # to check out the code
      actions: read # to find the CI run of the commit
    steps:
      # Lint, the notices check and the sanitizers run in CI, not here, so a
      # release waits for them.
      - name: Check that CI passed on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          if [ "$passed" = 0 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA. Once it has, re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the runner's Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27' || { echo "::error::Xcode 27 is required"; exit 1; }

      - name: Install GnuPG
        run: command -v gpg >/dev/null || brew install gnupg

      - name: Check the tag against the app version
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' App/Polycop.xcodeproj/project.pbxproj | sort -u)
          # The app compares plain version numbers; a suffix would leave
          # its users stuck on that build.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::MARKETING_VERSION $version is not a plain X.Y.Z version"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract the release notes
        run: |
          mkdir -p build/notes
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/notes/notes.md
          if ! grep -q '[^[:space:]]' build/notes/notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Build ffmpeg and audio.cpp
        run: |
          Tools/build-ffmpeg.sh
          Tools/build-audiocpp.sh

      - name: Test
        run: Tools/test.sh

      - name: Package
        run: |
          Tools/package.sh
          folder="build/releases/Polycop-$VERSION"
          mkdir build/upload
          cp "$folder"/Polycop-"$VERSION".{dmg,zip,dSYM.zip} \
            "$folder"/Polycop-"$VERSION".{dmg,zip,dSYM.zip}.sha256 \
            build/notes/notes.md build/upload/

      # Tests run a Debug build inside TestHost, whereas the shipped Release app
      # drops get-task-allow, compiles in whole-module Release mode without
      # Polycop.debug.dylib, is archived with ditto, and runs the full startup
      # path (HistoryStore.claim, sweeps, UserDefaults.standard, UpdatePrompt).
      # Unpack the zip publish attests and verify the app finishes launching.
      - name: Launch the packaged app
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          marker="$tmp/started"
          log="$tmp/launch.log"
          pid=""

          stop_app() {
            [ -n "$pid" ] || return 0
            kill -TERM "$pid" 2>/dev/null || true
            for _ in {1..10}; do
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            if kill -0 "$pid" 2>/dev/null; then
              kill -KILL "$pid" 2>/dev/null || true
            fi
          }

          cleanup() {
            stop_app
            if [ -n "$pid" ]; then
              wait "$pid" 2>/dev/null || true
            fi
            rm -rf "$tmp"
          }
          trap cleanup EXIT

          report_failure() {
            local message="$1"
            local prefix="$2"
            if [ -s "$log" ]; then
              cat "$log" 2>&1 || true
            fi
            # ReportCrash writes .ips files asynchronously after a crash.
            local found=0
            for _ in {1..10}; do
              for dir in "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports; do
                [ -d "$dir" ] || continue
                while IFS= read -r -d '' report; do
                  found=1
                  echo "::group::Crash report: $(basename "$report")"
                  cat "$report" 2>&1 || true
                  echo "::endgroup::"
                done < <(find "$dir" -maxdepth 1 -name "$prefix-*.ips" -newer "$marker" -print0 2>/dev/null || true)
              done
              [ "$found" -eq 1 ] && break
              sleep 1
            done
            echo "::error::$message"
          }

          ditto -x -k "build/upload/Polycop-$VERSION.zip" "$tmp/unpacked"
          bundle="$tmp/unpacked/Polycop $VERSION/Polycop.app"
          app="$bundle/Contents/MacOS/Polycop"
          helper="$bundle/Contents/Helpers/ffmpeg"
          if [ ! -x "$app" ]; then
            echo "::error::Packaged app executable not found: $app"
            exit 1
          fi
          codesign --verify --deep --strict "$bundle"

          touch "$marker"
          status=0
          "$helper" -version >"$log" 2>&1 || status=$?
          if [ "$status" -ne 0 ]; then
            report_failure "Bundled ffmpeg exited with status $status" ffmpeg
            exit 1
          fi

          touch "$marker"
          "$app" >"$log" 2>&1 &
          pid=$!

          # Poll until applicationDidFinishLaunching's five-second task records
          # launchCount in UserDefaults.standard, proving the app did not hang.
          ready=0
          for _ in {1..30}; do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              status=0
              wait "$pid" || status=$?
              pid=""
              report_failure "Packaged app exited early with status $status" Polycop
              exit 1
            fi
            launches="$(defaults read io.github.miravassor.Polycop launchCount 2>/dev/null || true)"
            if [[ "$launches" =~ ^[0-9]+$ ]] && [ "$launches" -ge 1 ]; then
              ready=1
              break
            fi
          done
          if [ "$ready" -ne 1 ]; then
            report_failure "Packaged app did not finish launching within 30 seconds" Polycop
            exit 1
          fi

          stop_app
          status=0
          wait "$pid" || status=$?
          pid=""
          # AppKit leaves SIGTERM at its default disposition (status 143).
          if [ "$status" -ne 0 ] && [ "$status" -ne 143 ]; then
            report_failure "Packaged app ended with unexpected status $status" Polycop
            exit 1
          fi

      # GPL directions to the source belong next to the download, and the
      # commit lets anyone match the files to the code.
      - name: Say where the files come from
        run: |
          {
            echo
            echo "### Files"
            echo
            echo "Built from commit $GITHUB_SHA in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, with $(xcodebuild -version | head -1)."
            echo "Polycop-$VERSION.zip holds the same app and the complete corresponding source of the app and of every bundled component. Polycop-$VERSION.dSYM.zip holds the debugging symbols that turn a crash report into lines of code."
            echo "The disk image and both zips are attested by GitHub: \`gh attestation verify Polycop-$VERSION.dmg --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml\` names the commit and the run that built it."
            echo
            echo "SHA-256:"
            echo
            cat build/upload/*.sha256 | sed 's/^/    /'
          } >> build/upload/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: build/upload/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    # Only version tags may use this environment (repository setting).
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to draft the release and upload its files
      id-token: write # to sign the attestations
      attestations: write # to store the attestations
      artifact-metadata: write # to record the attested files
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release

      # Anyone can then check that a file was built here, from which commit:
      # gh attestation verify Polycop-X.Y.Z.dmg --repo miravassor/polycop \
      #   --signer-workflow miravassor/polycop/.github/workflows/release.yml
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "Polycop-$version.dmg" "Polycop-$version.dmg.sha256" \
            "Polycop-$version.zip" "Polycop-$version.zip.sha256" \
            "Polycop-$version.dSYM.zip" "Polycop-$version.dSYM.zip.sha256" \
            --title "Polycop $version" --notes-file notes.md --draft

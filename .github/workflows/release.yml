# SPDX-License-Identifier: GPL-3.0-or-later
# Builds a release from a version tag such as v0.2.0 and drafts it on GitHub.
# Dependencies are built from their pinned sources, without cache.
#
# The build runs third-party build systems and tests, so it gets read access
# only. A second job, which runs nothing from the repository, attests what was
# built and drafts the release. Run by hand, the workflow builds and stops
# there, as a rehearsal.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read # to check out the code
      actions: read # to find the CI run of the commit
    steps:
      # Lint, the notices check and the sanitizers run in CI, not here, so a
      # release waits for them.
      - name: Check that CI passed on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&status=success" --jq .total_count)
          if [ "$passed" = 0 ]; then
            echo "::error::CI has not passed on $GITHUB_SHA. Once it has, re-run this workflow."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the runner's Xcode
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -version | grep -q '^Xcode 27' || { echo "::error::Xcode 27 is required"; exit 1; }

      - name: Install GnuPG
        run: command -v gpg >/dev/null || brew install gnupg

      - name: Check the tag against the app version
        run: |
          version=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' App/Polycop.xcodeproj/project.pbxproj | sort -u)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Extract the release notes
        run: |
          mkdir -p build/notes
          awk -v heading="## $VERSION" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > build/notes/notes.md
          if ! grep -q '[^[:space:]]' build/notes/notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi

      - name: Build ffmpeg and audio.cpp
        run: |
          Tools/build-ffmpeg.sh
          Tools/build-audiocpp.sh

      - name: Test
        run: >
          xcodebuild test
          -project App/Polycop.xcodeproj
          -scheme Polycop
          -destination 'platform=macOS,arch=arm64'
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Package
        run: |
          Tools/package.sh
          folder="build/releases/Polycop-$VERSION"
          mkdir build/upload
          cp "$folder"/Polycop-"$VERSION".{dmg,zip,dSYM.zip} \
            "$folder"/Polycop-"$VERSION".{dmg,zip,dSYM.zip}.sha256 \
            build/notes/notes.md build/upload/

      # GPL directions to the source belong next to the download, and the
      # commit lets anyone match the files to the code.
      - name: Say where the files come from
        run: |
          {
            echo
            echo "### Files"
            echo
            echo "Built from commit $GITHUB_SHA in run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID, with $(xcodebuild -version | head -1)."
            echo "Polycop-$VERSION.zip holds the same app and the complete corresponding source of the app and of every bundled component. Polycop-$VERSION.dSYM.zip holds the debugging symbols that turn a crash report into lines of code."
            echo "The disk image and both zips are attested by GitHub: \`gh attestation verify Polycop-$VERSION.dmg --repo $GITHUB_REPOSITORY\` names the commit and the run that built it."
            echo
            echo "SHA-256:"
            echo
            cat build/upload/*.sha256 | sed 's/^/    /'
          } >> build/upload/notes.md

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: build/upload/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: github.event_name == 'push'
    # Only version tags may use this environment (repository setting).
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to draft the release and upload its files
      id-token: write # to sign the attestations
      attestations: write # to store the attestations
      artifact-metadata: write # to record the attested files
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      # Anyone can then check that a file was built here, from which commit:
      # gh attestation verify Polycop-X.Y.Z.dmg --repo miravassor/polycop
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/*.dmg
            release/*.zip

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "Polycop-$version.dmg" "Polycop-$version.dmg.sha256" \
            "Polycop-$version.zip" "Polycop-$version.zip.sha256" \
            "Polycop-$version.dSYM.zip" "Polycop-$version.dSYM.zip.sha256" \
            --title "Polycop $version" --notes-file notes.md --draft
